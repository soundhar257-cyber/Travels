<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment - TravelGo</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <form class="styled-form" th:action="@{'/booking/payment/' + ${booking.id}}" method="post">
        <h2>Payment</h2>
        <p style="margin-bottom:10px;">Destination: <strong th:text="${booking.travelPackage.destination}"></strong></p>
        <p style="margin-bottom:10px;">Travelers: <strong th:text="${booking.numberOfTravelers}"></strong></p>
        <div class="price" style="margin-bottom:20px;">Total: &#8377; <span th:text="${booking.totalAmount}">0</span></div>

        <label>Card number</label>
        <input type="text" placeholder="4111 1111 1111 1111" maxlength="19" required />

        <label>Expiry</label>
        <input type="text" placeholder="MM/YY" required />

        <label>CVV</label>
        <input type="text" placeholder="123" maxlength="3" required />

        <p style="font-size:12px;color:#94a3b8;margin-bottom:16px;">
            This is a simulated payment for demo purposes. Plug in a real gateway (Razorpay/Stripe) here for production.
        </p>

        <button class="btn" type="submit" style="width:100%">Pay now</button>
    </form>
</body>
</html>
