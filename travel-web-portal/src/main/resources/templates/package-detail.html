<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${travelPackage.destination}">Package</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="container">
        <div class="card" style="max-width:600px;">
            <img th:src="${travelPackage.imageUrl}" alt="destination" onerror="this.style.display='none'"/>
            <div class="card-body">
                <h2 th:text="${travelPackage.destination}">Destination</h2>
                <p th:text="${travelPackage.description}">Description</p>
                <p th:text="${travelPackage.durationDays} + ' days'"></p>
                <div class="price">&#8377; <span th:text="${travelPackage.price}">0</span> / person</div>
                <a class="btn" th:href="@{'/booking/new/' + ${travelPackage.id}}">Book now</a>
            </div>
        </div>
    </div>
</body>
</html>
